<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Боковая панель</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="sidebar__conteiner">
        <header class="header__conteiner">
            <div class="header__block">
                <button class="header__block--burger" type="button">
                    <img src="./IMG/burger.svg" alt="иконка меню">
                </button>
                <button class="header__block--logo" type="button">
                    <img src="./IMG/Group.png" alt="логотип">
                </button>
                <button class="header__block--search" type="button">
                    <img src="./IMG/search.svg" alt="поиск">
                </button>
            </div>
        </header>
        <aside>
            <div class="sidebar__menu">
                <ul class="sidebar__list">
                    <li class="sidebar__item">
                        <button type="button" class="sidebar__button">
                            Ремонт техники
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button type="button" class="sidebar__button">
                            Услуги и сервисы
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button type="button" class="sidebar__button">
                            Корпоративным клиентам
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button type="button" class="sidebar__button">
                            Продавцам техники
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button type="button" class="sidebar__button">
                            Партнерам
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button type="button" class="sidebar__button">
                            Производителям
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button type="button" class="sidebar__button">
                            Наши сервисные центры
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button type="button" class="sidebar__button">
                            Контакты
                        </button>
                    </li>
                </ul>
            </div>
            <div class="sidebar__contact">
                <div class="sidebar__contact__icon">
                    <button type="button" class="sidebar__contact__icon--call">
                        <img src="./IMG/call.svg" alt="позвонить">
                    </button>
                    <button type="button" class="sidebar__contact__icon--chat">
                        <img src="./IMG/chat.svg" alt="написать">
                    </button>
                    <button type="button" class="sidebar__contact__icon--profil">
                        <img src="./IMG/profile.svg" alt="Профиль">
                    </button>
                </div>
                <div class="sidebar__contact__mail">
                    <span>mail@cps.com</span>
                </div>
                <div class="sidebar__contact__phone">
                    <span>8 800 890 8900</span>
                </div>
            </div>
            <div class="sidebar__lang-switcher">
                <button type="button" class="lang-switcher">
                    RU
                </button>
                <button type="button" class="lang-switcher">
                    EN
                </button>
                <button type="button" class="lang-switcher">
                    CH
                </button>
            </div>
        </aside>
    </div>

</body>

</html>
